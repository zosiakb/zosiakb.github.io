<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Themes ---------- */
  body, .swatch[data-t="pink"] {
    --bg: #FFF0F3;
    --cell: #F67987;      --border: #C93D55;   --text: #3D0B17;
    --done: #C93D55;      --done-text: #FFFFFF;
    --title: #C93D55;     --title-hover: #F67987;
  }
  body[data-theme="blue"], .swatch[data-t="blue"] {
    --bg: #EDF7FD;
    --cell: #008DD5;      --border: #7FCBF0;   --text: #FFFFFF;
    --done: #005F8F;      --done-text: #FFFFFF;
    --title: #008DD5;     --title-hover: #005F8F;
  }
  body[data-theme="black"], .swatch[data-t="black"] {
    --bg: #FFFFFF;
    --cell: #000000;      --border: #000000;   --text: #FFFFFF;
    --done: #FFFFFF;      --done-text: #000000;
    --title: #000000;     --title-hover: #555555;
  }

  /* ---------- Layout ---------- */
  body {
    font-family: "Mountains of Christmas", Georgia, serif;
    background: var(--bg);
    color: var(--text);
    max-width: 560px; margin: 20px auto; padding: 0 12px;
    transition: background .3s;
  }

  #title {
    font-size: 40px; font-weight: 700; text-align: center; margin: 10px 0 12px;
    color: var(--title); cursor: pointer; user-select: none;
    transition: color .2s, transform .2s;
  }
  #title:hover, #title:focus-visible { color: var(--title-hover); transform: scale(1.08); outline: none; }

  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

  /* Cards: grid cells, buttons and theme swatches share this look */
  .cell, button {
    background: var(--cell); color: var(--text);
    border: 4px solid var(--border);
    font-family: inherit; font-weight: 700;
    transition: transform .15s, background .2s;
  }
  .cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 17px; padding: 4px; cursor: pointer;
    user-select: none; overflow: hidden; word-break: break-word;
  }
  .cell.done  { background: var(--done); color: var(--done-text);
                text-decoration: line-through; text-decoration-thickness: 3px; }
  .cell.free  { text-decoration: none; }
  .cell.bingo { border-color: #FFB300; box-shadow: 0 0 10px #FFB300; }
  .cell textarea {
    width: 100%; height: 100%; border: none; resize: none; background: none;
    font: inherit; color: inherit; text-align: center;
  }
  .cell textarea::placeholder { color: inherit; opacity: .5; }

  .bar { display: flex; gap: 8px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
  button { font-size: 20px; padding: 6px 16px; cursor: pointer; }
  button:hover { transform: scale(1.05); }
  .swatch.active { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--border); }

  #status { text-align: center; font-size: 16px; opacity: .6; word-break: break-all; color: var(--title); }
  #msg { text-align: center; font-weight: 700; font-size: 30px; margin-top: 8px; color: var(--title); }
</style>
</head>
<body>
<h1 id="title" tabindex="0" title="Click to switch"></h1>

<div id="grid"></div>
<div id="msg"></div>
<div class="bar">
  <button id="editBtn"></button>
  <button id="newBtn">New card</button>
  <button id="copyBtn">My link</button>
</div>
<div class="bar">
  <button class="swatch" data-t="pink">Pink</button>
  <button class="swatch" data-t="blue">Blue</button>
  <button class="swatch" data-t="black">Black</button>
</div>
<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAMlwMCN_fOZcnbgyc_NYd_irPTsPsjtuk",
  authDomain: "goals-and-bucket-list-bingo.firebaseapp.com",
  projectId: "goals-and-bucket-list-bingo",
});
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const TITLES = ["My goals bingo!", "My bucket list bingo!"];
const LINES = [];
for (let i = 0; i < 5; i++) {
  LINES.push([0,1,2,3,4].map(j => i*5 + j));   // rows
  LINES.push([0,1,2,3,4].map(j => j*5 + i));   // columns
}
LINES.push([0,6,12,18,24], [4,8,12,16,20]);    // diagonals

let card, cardId, editing = false, saveTimer;

// ---------- Theme (remembered per browser) ----------
function setTheme(t) {
  document.body.dataset.theme = t;
  document.querySelectorAll(".swatch").forEach(b => b.classList.toggle("active", b.dataset.t === t));
  try { localStorage.setItem("bingoTheme", t); } catch {}
}
let savedTheme = "pink";
try { savedTheme = localStorage.getItem("bingoTheme") || "pink"; } catch {}
setTheme(savedTheme);
document.querySelectorAll(".swatch").forEach(b => b.onclick = () => setTheme(b.dataset.t));

// ---------- Card ----------
function blank() {
  const cells = Array.from({length: 25}, () => ({text: "", done: false}));
  cells[12] = {text: "FREE", done: true};
  return {title: TITLES[0], cells};
}
const newId = () => crypto.randomUUID().replace(/-/g, "").slice(0, 16);

function remember(id) {
  location.hash = id;
  try { localStorage.setItem("bingoId", id); } catch {}
}

async function load() {
  let saved = null;
  try { saved = localStorage.getItem("bingoId"); } catch {}
  cardId = location.hash.slice(1) || saved;
  if (cardId) {
    const snap = await getDoc(doc(db, "cards", cardId));
    card = snap.exists() ? snap.data() : blank();
  } else {
    cardId = newId(); card = blank(); editing = true;
  }
  if (!TITLES.includes(card.title)) card.title = TITLES[0];
  remember(cardId);
  render();
}

function save() {
  clearTimeout(saveTimer);
  $("status").textContent = "Saving…";
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(doc(db, "cards", cardId), {title: card.title, cells: card.cells});
      $("status").textContent = "Saved";
    } catch (e) {
      $("status").textContent = "Couldn't save: " + e.message;
    }
  }, 600);
}

function render() {
  $("title").textContent = card.title;
  $("editBtn").textContent = editing ? "Done editing" : "Edit";  const won = LINES.filter(l => l.every(i => card.cells[i].done));
  const bingoCells = new Set(won.flat());
  $("msg").textContent = won.length ? `BINGO${won.length > 1 ? " ×" + won.length : ""}!` : "";

  const grid = $("grid");
  grid.innerHTML = "";
  card.cells.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "cell" + (c.done ? " done" : "") + (bingoCells.has(i) ? " bingo" : "") + (i === 12 ? " free" : "");
    if (editing) {
      const ta = document.createElement("textarea");
      ta.value = c.text;
      ta.placeholder = "…";
      ta.oninput = () => { c.text = ta.value; save(); };
      el.append(ta);
    } else {
      el.textContent = c.text || "—";
      el.onclick = () => { c.done = !c.done; save(); render(); };
    }
    grid.append(el);
  });
}

function toggleTitle() {
  card.title = card.title === TITLES[0] ? TITLES[1] : TITLES[0];
  $("title").textContent = card.title;
  save();
}
$("title").onclick = toggleTitle;
$("title").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleTitle(); } };

$("editBtn").onclick = () => { editing = !editing; render(); };
$("newBtn").onclick = () => {
  cardId = newId(); card = blank(); editing = true;
  remember(cardId); render();
  $("status").textContent = "New card — your old one is still at its old link.";
};
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("status").textContent = "Link copied — bookmark it!"; }
  catch { $("status").textContent = location.href; }
};
window.onhashchange = () => { if (location.hash.slice(1) !== cardId) load(); };

load();
</script>
</body>
</html>
