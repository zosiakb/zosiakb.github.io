<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resolution Bingo</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:20px auto;padding:0 12px;color:#222}
  #title{font:bold 26px system-ui;border:none;width:100%;text-align:center;background:none}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .cell{aspect-ratio:1;border:2px solid #ccc;border-radius:8px;display:flex;align-items:center;justify-content:center;
        text-align:center;font-size:13px;padding:4px;cursor:pointer;user-select:none;overflow:hidden;word-break:break-word}
  .cell.done{background:#c8f7c5;border-color:#4caf50}
  .cell.bingo{background:#ffe082;border-color:#ffb300}
  .cell textarea{width:100%;height:100%;border:none;resize:none;font:inherit;text-align:center;background:none}
  .bar{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
  button{padding:6px 12px;border-radius:6px;border:1px solid #aaa;background:#fff;cursor:pointer}
  #status{text-align:center;font-size:12px;color:#888;word-break:break-all}
  #msg{text-align:center;font-weight:bold;font-size:20px;min-height:28px}
</style>
</head>
<body>
<input id="title">
<div class="bar">
  <button id="editBtn"></button>
  <button id="newBtn">➕ New card</button>
  <button id="copyBtn">🔗 My link</button>
</div>
<div id="msg"></div>
<div id="grid"></div>
<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Paste your Firebase web config here (Project settings → Your apps → Web app)
const app = initializeApp({
  apiKey: "PASTE",
  authDomain: "PASTE",
  projectId: "PASTE",
});
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const LINES = [];
for (let i = 0; i < 5; i++) {
  LINES.push([0,1,2,3,4].map(j => i*5 + j));   // rows
  LINES.push([0,1,2,3,4].map(j => j*5 + i));   // columns
}
LINES.push([0,6,12,18,24], [4,8,12,16,20]);    // diagonals

let card, cardId, editing = false, saveTimer;

function blank() {
  const cells = Array.from({length: 25}, () => ({text: "", done: false}));
  cells[12] = {text: "FREE", done: true};
  return {title: "My 2027 Bingo", cells};
}
const newId = () => crypto.randomUUID().replace(/-/g, "").slice(0, 16);

function remember(id) {
  location.hash = id;
  try { localStorage.setItem("bingoId", id); } catch {}
}

async function load() {
  let saved = null;
  try { saved = localStorage.getItem("bingoId"); } catch {}
  cardId = location.hash.slice(1) || saved;
  if (cardId) {
    const snap = await getDoc(doc(db, "cards", cardId));
    card = snap.exists() ? snap.data() : blank();
  } else {
    cardId = newId(); card = blank(); editing = true;
  }
  remember(cardId);
  render();
}

function save() {
  clearTimeout(saveTimer);
  $("status").textContent = "Saving…";
  saveTimer = setTimeout(async () => {
    try {
      await setDoc(doc(db, "cards", cardId), {title: card.title, cells: card.cells});
      $("status").textContent = "Saved ✓";
    } catch (e) {
      $("status").textContent = "Couldn't save: " + e.message;
    }
  }, 600);
}

function render() {
  $("title").value = card.title;
  $("editBtn").textContent = editing ? "✅ Done editing" : "✏️ Edit";
  const won = LINES.filter(l => l.every(i => card.cells[i].done));
  const bingoCells = new Set(won.flat());
  $("msg").textContent = won.length ? `🎉 BINGO${won.length > 1 ? " ×" + won.length : ""}!` : "";

  const grid = $("grid");
  grid.innerHTML = "";
  card.cells.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "cell" + (c.done ? " done" : "") + (bingoCells.has(i) ? " bingo" : "");
    if (editing) {
      const ta = document.createElement("textarea");
      ta.value = c.text;
      ta.placeholder = "…";
      ta.oninput = () => { c.text = ta.value; save(); };
      el.append(ta);
    } else {
      el.textContent = c.text || "—";
      el.onclick = () => { c.done = !c.done; save(); render(); };
    }
    grid.append(el);
  });
}

$("title").oninput = e => { card.title = e.target.value; save(); };
$("editBtn").onclick = () => { editing = !editing; render(); };
$("newBtn").onclick = () => {
  cardId = newId(); card = blank(); editing = true;
  remember(cardId); render();
  $("status").textContent = "New card — your old one is still at its old link.";
};
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("status").textContent = "Link copied — bookmark it!"; }
  catch { $("status").textContent = location.href; }
};
window.onhashchange = () => { if (location.hash.slice(1) !== cardId) load(); };

load();
</script>
</body>
</html>
